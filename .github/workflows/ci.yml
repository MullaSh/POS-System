name: Tes otomatis

on:
  push:
    branches: [main, 'irisan-*']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pos" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, intl, zip, bcmath
          coverage: none
      - name: Pasang paket PHP
        run: |
          if [ -f composer.lock ]; then composer install --no-interaction --prefer-dist
          else composer update --no-interaction --prefer-dist; fi
      - name: Siapkan konfigurasi
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Jalankan tes
        run: php artisan test
      - name: Simpan composer.lock ke repository (sekali, bila belum ada)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain composer.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "Kunci versi paket PHP (composer.lock dari CI)"
            git push
          fi

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  docker:
    name: Docker (uji jalan lengkap)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bangun dan jalankan
        run: docker compose up --build -d
      - name: Periksa aplikasi dari browser
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health; then echo; exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Periksa halaman login
        run: curl -fsS http://localhost:8080/login | grep -q '<div id="root">'
      - name: Coba masuk dengan akun contoh dan baca data barang
        run: |
          jar=$(mktemp)
          base=http://localhost:8080
          curl -fsS -c "$jar" -b "$jar" -H "Referer: $base/" "$base/sanctum/csrf-cookie" -o /dev/null
          token=$(awk '$6=="XSRF-TOKEN"{print $7}' "$jar" | python3 -c "import sys,urllib.parse;print(urllib.parse.unquote(sys.stdin.read().strip()))")
          curl -fsS -c "$jar" -b "$jar" -H "Accept: application/json" -H "Content-Type: application/json" \
            -H "X-XSRF-TOKEN: $token" -H "Referer: $base/" \
            -d '{"username":"owner","password":"demo12345"}' "$base/api/v1/auth/login" | tee /dev/stderr | grep -q '"username":"owner"'
          get() { curl -fsS -b "$jar" -H "Accept: application/json" -H "Referer: $base/" "$base/api/v1/$1"; }
          get items | grep -q 'BB-AYAM'
          get items | grep -q '"current_price":25000'
          get payment-methods | grep -q '"code":"CASH"'
          get approvals/summary | grep -q '"waiting_my_decision":2'
          get recipes | grep -q 'MN-DIMSUM4'
          get stock/locations | grep -q '"code":"GDG"'
          get 'recipes?kind=MENU' | grep -q '"per_output_unit":"9200.0000"'
          get 'stock-requests?status=OPEN' | grep -q '"status":"SUBMITTED"'
          get 'stock-transfers?status=OPEN' | grep -q '"status":"IN_TRANSIT"'
          get sales | grep -q 'TRX-'
          get 'shifts?status=RUNNING' | grep -q '"status":"OPEN"'
          get delegations | grep -q '"status":"ACTIVE"'
          get cash/overview | grep -q '"petty_cash":175000'
          get cash/expenses | grep -q 'BYA-'
          get 'purchasing/requests?status=PENDING' | grep -q '"number":"PR-'
          get 'purchasing/orders?status=OPEN' | grep -q '"status":"ORDERED"'
          get purchasing/settings | grep -q '"finance_limit":5000000'
          echo "Login dan data contoh berfungsi"
      - name: Ambil screenshot layar
        run: |
          mkdir -p /tmp/shots && cd /tmp/shots
          npm init -y >/dev/null && npm install --silent playwright@1 && npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/.github/scripts/screenshots.mjs" . && node screenshots.mjs /tmp/shots
      - name: Simpan screenshot ke branch ci-screenshots
        if: github.event_name == 'push'
        run: |
          cd /tmp/shots && git init -q -b ci-screenshots && git add *.png
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Screenshot ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
      - if: always()
        run: docker compose down -v
